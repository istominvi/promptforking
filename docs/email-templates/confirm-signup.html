<!--
  Promptforking — шаблон письма "Confirm signup" (первая регистрация нового адреса).
  Вставь содержимое в Supabase Dashboard → Authentication → Email Templates → Confirm signup.
  Переменная {{ .ConfirmationURL }} подставляется Supabase автоматически.
  Email-совместимый HTML: table-layout + inline-стили (так письмо одинаково выглядит в Gmail/Outlook/Mail).
-->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="
    background-color: #f4f4f5;
    padding: 32px 0;
    font-family:
      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;
  "
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="480"
        cellpadding="0"
        cellspacing="0"
        style="
          max-width: 480px;
          width: 100%;
          background-color: #ffffff;
          border: 1px solid #e4e4e7;
          border-radius: 12px;
          padding: 40px;
        "
      >
        <tr>
          <td style="font-size: 20px; font-weight: 700; color: #18181b; padding-bottom: 8px">
            Promptforking
          </td>
        </tr>
        <tr>
          <td style="font-size: 24px; font-weight: 700; color: #18181b; padding-bottom: 16px">
            Подтверди регистрацию
          </td>
        </tr>
        <tr>
          <td style="font-size: 15px; line-height: 1.6; color: #3f3f46; padding-bottom: 28px">
            Добро пожаловать! Нажми кнопку ниже, чтобы подтвердить адрес и войти. Если ты не
            регистрировался на Promptforking, просто проигнорируй это письмо.
          </td>
        </tr>
        <tr>
          <td style="padding-bottom: 28px">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                background-color: #18181b;
                color: #ffffff;
                font-size: 15px;
                font-weight: 600;
                text-decoration: none;
                padding: 12px 28px;
                border-radius: 8px;
              "
            >
              Подтвердить и войти
            </a>
          </td>
        </tr>
        <tr>
          <td style="font-size: 13px; line-height: 1.6; color: #71717a; padding-bottom: 8px">
            Если кнопка не работает, скопируй ссылку в браузер:
          </td>
        </tr>
        <tr>
          <td style="font-size: 13px; line-height: 1.6; color: #2563eb; word-break: break-all">
            {{ .ConfirmationURL }}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
